<title>Pitch Session Judging – MCAST R&amp;I Expo 2026</title>
<meta name="description" content="Live judging for the Innovation & Valorisation Pitch Session, MCAST R&I Expo 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root { --navy:#000043; --cyan:#199CD8; --tint:#F0F3F8; --ink:#1F233A; --muted:#5B6075; --ice:#BFD9EE; --rule:#D5DBE6; --ok:#1E8E5A; --warn:#B26A00; --bad:#B00020; }
* { box-sizing:border-box; }
body { margin:0; font-family:Montserrat, Arial, sans-serif; color:var(--ink); background:#fff; font-size:15px; line-height:1.45; }
header { background:var(--navy); color:#fff; }
.wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
header .wrap { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-top:24px; padding-bottom:20px; }
.k { color:var(--cyan); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
h1 { margin:6px 0 0; font-size:27px; line-height:1.15; }
header .sub { color:var(--ice); margin-top:6px; font-size:14px; }
header img { height:46px; flex:none; }
main .wrap { padding-top:18px; padding-bottom:60px; }
h2 { color:var(--navy); font-size:19px; margin:26px 0 8px; }
h3 { color:var(--navy); font-size:16px; margin:0 0 8px; }
p.lead { color:var(--muted); font-size:14px; margin:0 0 12px; }
.muted { color:var(--muted); font-size:13px; }
.btn { font:inherit; font-weight:700; font-size:14px; border:none; border-radius:999px; padding:10px 18px; cursor:pointer; background:var(--navy); color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.btn.alt { background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
.btn.cy { background:var(--cyan); }
.btn.sm { padding:7px 13px; font-size:13px; }
.btn.ghost { background:none; color:var(--muted); padding:6px 10px; font-weight:600; }
.btn.ghost:hover { color:var(--bad); }
.btn:disabled { opacity:.45; cursor:default; }
.btn:focus-visible, .sc:focus-visible, .tab:focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
input[type=text], input[type=number], textarea { font:inherit; font-size:14px; color:var(--ink); border:1.5px solid var(--rule); border-radius:8px; padding:8px 10px; background:#fff; width:100%; }
input:focus, textarea:focus { outline:none; border-color:var(--cyan); }
textarea { min-height:58px; resize:vertical; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.banner { border-radius:12px; padding:10px 14px; font-size:14px; margin-bottom:12px; }
.banner.info { background:#E6F3FB; color:#0B5E86; } .banner.warn { background:#FFF3E0; color:#7A4A00; } .banner.err { background:#FDECEC; color:#8A1C1C; } .banner.ok { background:#E6F4EC; color:#14532D; }
.card { border:1.5px solid var(--rule); border-radius:14px; padding:16px; }
.card.tint { background:var(--tint); border-color:var(--tint); }
.card.navy { background:var(--navy); border-color:var(--navy); color:var(--ice); }
.card.navy h3 { color:#fff; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
/* tabs */
.tabs { display:flex; gap:6px; flex-wrap:wrap; border-bottom:2px solid var(--navy); margin-top:4px; position:sticky; top:0; background:#fff; z-index:5; padding-top:8px; }
.tab { font:inherit; font-size:14px; font-weight:700; border:1.5px solid var(--rule); border-bottom:none; background:#fff; color:var(--navy); border-radius:12px 12px 0 0; padding:9px 14px; cursor:pointer; display:flex; gap:8px; align-items:center; }
.tab[aria-selected=true] { background:var(--navy); color:#fff; border-color:var(--navy); }
.tab .pill { font-size:11px; padding:1px 8px; border-radius:999px; background:var(--tint); color:var(--muted); }
.tab[aria-selected=true] .pill { background:rgba(255,255,255,.18); color:#fff; }
.tab .pill.full { background:#E6F4EC; color:var(--ok); }
.tab .you { font-size:10px; background:var(--cyan); color:#fff; border-radius:999px; padding:1px 7px; }
.panel { padding-top:18px; }
/* setup */
.stepper { display:inline-flex; align-items:center; border:1.5px solid var(--navy); border-radius:999px; overflow:hidden; }
.stepper button { font:inherit; font-weight:700; font-size:18px; width:40px; height:38px; border:none; background:#fff; color:var(--navy); cursor:pointer; }
.stepper span { min-width:44px; text-align:center; font-weight:700; color:var(--navy); font-size:17px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px 10px; border-bottom:1.5px solid var(--navy); background:var(--tint); white-space:nowrap; }
td { padding:8px 10px; border-bottom:1px solid var(--rule); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
td.n, th.n { text-align:center; }
.tw { overflow-x:auto; border:1.5px solid var(--rule); border-radius:12px; }
.tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:#FFF3E0; color:var(--warn); margin-left:6px; white-space:nowrap; }
.tag.ok { background:#E6F4EC; color:var(--ok); } .tag.info { background:#E6F3FB; color:#0B5E86; } .tag.mut { background:var(--tint); color:var(--muted); }
.qr { width:170px; height:170px; background:#fff; border-radius:8px; padding:6px; flex:none; } .qr svg { width:100%; height:100%; display:block; }
.link { font-size:13px; word-break:break-all; background:#fff; border-radius:8px; padding:7px 10px; color:var(--navy); border:1.5px solid var(--rule); }
.key { font-size:22px; font-weight:700; letter-spacing:.12em; color:#fff; }
.switch { display:flex; gap:10px; align-items:center; cursor:pointer; font-size:14px; }
.switch input { width:20px; height:20px; accent-color:var(--cyan); }
/* results */
.leaders { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.leaders > div { background:var(--navy); color:var(--ice); border-radius:12px; padding:14px 16px; font-size:13px; }
.leaders > div.pc { background:var(--cyan); color:#fff; }
.leaders strong { display:block; color:#fff; font-size:15px; margin-bottom:2px; }
.leaders .who { color:#fff; font-weight:700; font-size:18px; margin-top:8px; line-height:1.3; }
.leaders .sc { font-weight:600; opacity:.9; font-size:13px; }
.rank { display:inline-flex; width:28px; height:28px; border-radius:50%; background:var(--navy); color:#fff; font-weight:700; align-items:center; justify-content:center; font-size:13px; }
tr.top1 .rank { background:var(--cyan); }
td.big { font-weight:700; color:var(--navy); font-size:16px; }
details summary { cursor:pointer; color:var(--cyan); font-size:12px; font-weight:600; }
ul.notes { font-size:12.5px; margin:6px 0 0; padding-left:16px; }
.how { font-size:13px; color:var(--muted); background:var(--tint); border-radius:12px; padding:12px 16px; margin-top:12px; } .how b { color:var(--navy); }
/* judge tab */
.guide { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:8px 0 4px; }
.guide div { background:var(--tint); border-radius:10px; padding:8px 10px; font-size:12.5px; color:var(--muted); }
.guide b { display:inline-flex; width:20px; height:20px; border-radius:50%; background:var(--navy); color:#fff; align-items:center; justify-content:center; font-size:11px; margin-right:5px; }
.guide strong { color:var(--navy); }
.team { border:1.5px solid var(--rule); border-radius:14px; margin-top:14px; overflow:hidden; }
.team.done { border-color:var(--ice); }
.thead { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; background:var(--tint); padding:11px 16px; }
.thead b { color:var(--navy); font-size:16px; }
.crit { display:grid; grid-template-columns:1fr auto; gap:6px 18px; align-items:center; padding:10px 16px; border-top:1px solid var(--rule); }
.crit .t { font-weight:700; color:var(--navy); }
.crit .t i { font-style:normal; display:inline-flex; width:20px; height:20px; border-radius:50%; background:var(--cyan); color:#fff; font-size:11px; align-items:center; justify-content:center; margin-right:8px; vertical-align:1px; }
.crit .q { font-size:13px; color:var(--muted); padding-left:28px; }
.seg { display:flex; gap:6px; }
.sc { width:42px; height:42px; border-radius:50%; border:1.6px solid var(--navy); background:#fff; font:inherit; font-weight:700; color:var(--navy); cursor:pointer; font-size:15px; }
.sc[aria-pressed=true] { background:var(--navy); color:#fff; }
.sc:disabled { cursor:default; opacity:.85; } .sc:disabled[aria-pressed=false] { opacity:.35; }
.tfoot { display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; background:var(--navy); color:#fff; padding:11px 16px; }
.pv { display:flex; align-items:baseline; gap:6px; } .pv small { color:var(--ice); font-weight:600; font-size:12px; }
.pv b { background:#fff; color:var(--navy); border-radius:8px; padding:3px 11px; font-size:17px; min-width:70px; text-align:right; }
.notesbox { padding:10px 16px; border-top:1px solid var(--rule); }
.notesbox .ro { font-size:14px; white-space:pre-wrap; color:var(--ink); }
.claim { max-width:520px; }
.saving { position:fixed; right:16px; bottom:16px; background:var(--navy); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
.saving.on { opacity:.92; }
footer { color:var(--muted); font-size:12px; border-top:1px solid var(--rule); padding:14px 0 30px; } footer a { color:var(--muted); }
@media (max-width:820px) { .grid2, .leaders { grid-template-columns:1fr; } .guide { grid-template-columns:1fr 1fr; } h1 { font-size:21px; } header img { height:34px; }
  .crit { grid-template-columns:1fr; } .crit .q { padding-left:0; } .sc { width:46px; height:46px; } }
/* final results */
.final { text-align:center; }
.final .fh { margin:6px 0 4px; } .final .fh .k { font-size:13px; } .final .fh h2 { font-size:30px; margin:6px 0 2px; }
.final .when { color:var(--muted); font-size:13px; }
.podium { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin:22px 0 10px; align-items:end; }
.place { border-radius:18px; padding:22px 18px; background:var(--tint); color:var(--navy); }
.place.p1 { background:var(--navy); color:#fff; padding:34px 18px; box-shadow:0 12px 34px rgba(0,0,67,.25); }
.place.p2, .place.p3 { background:#E4EBF5; }
.place .medal { display:inline-flex; width:58px; height:58px; border-radius:50%; align-items:center; justify-content:center; font-weight:700; font-size:24px; background:#fff; color:var(--navy); border:3px solid var(--cyan); }
.place.p1 .medal { width:72px; height:72px; font-size:30px; background:var(--cyan); color:#fff; border-color:#fff; }
.place .tn { font-size:22px; font-weight:700; margin:12px 0 2px; line-height:1.2; } .place.p1 .tn { font-size:28px; }
.place .tno { font-size:13px; opacity:.75; } .place .ts { margin-top:10px; font-size:15px; font-weight:600; opacity:.9; }
.place .tie { display:inline-block; margin-top:8px; font-size:12px; font-weight:700; background:#FFF3E0; color:var(--warn); border-radius:999px; padding:2px 10px; }
.flist { max-width:720px; margin:6px auto 0; text-align:left; } .flist .r { display:flex; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid var(--rule); font-size:17px; }
.flist .r b.rk { display:inline-flex; width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; align-items:center; justify-content:center; font-size:14px; flex:none; }
.flist .r span.sc2 { margin-left:auto; color:var(--muted); font-weight:600; }
.awards3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:26px; text-align:left; }
.awards3 > div { background:var(--navy); color:var(--ice); border-radius:14px; padding:16px 18px; } .awards3 > div.pc { background:var(--cyan); color:#fff; }
.awards3 strong { display:block; color:#fff; font-size:16px; } .awards3 .w { color:#fff; font-size:20px; font-weight:700; margin-top:10px; line-height:1.25; } .awards3 small { display:block; margin-top:4px; opacity:.85; font-size:12px; font-weight:600; }
.fctl { display:grid; grid-template-columns:repeat(4, auto) 1fr; gap:14px 22px; align-items:end; }
.fctl label.lab { display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.fctl select { font:inherit; font-size:14px; border:1.5px solid var(--rule); border-radius:8px; padding:8px 10px; background:#fff; color:var(--ink); max-width:260px; text-transform:none; letter-spacing:0; font-weight:500; }
.stepper button:disabled { opacity:.3; cursor:default; }
body.present header, body.present footer, body.present .tabs, body.present .noprint, body.present .banner { display:none !important; }
body.present main .wrap { max-width:1500px; padding-top:30px; } body.present .final .fh h2 { font-size:42px; } body.present .place .tn { font-size:30px; } body.present .place.p1 .tn { font-size:38px; }
@media (max-width:820px) { .awards3 { grid-template-columns:1fr; } .fctl { grid-template-columns:1fr 1fr; } .final .fh h2 { font-size:24px; } }
@media print { .noprint, .tabs { display:none !important; } header, .leaders > div, .rank, th, .tfoot { -webkit-print-color-adjust:exact; print-color-adjust:exact; } .tw { border:none; overflow:visible; } tr, .team { break-inside:avoid; } }
</style></head>

// Both expose: uid, watchEvent, watchJudges, createEvent, patchEvent, patchJudge, claimOwner, readKey, isClaimedOwner
function deepMerge(a, b) { const o = { ...(a || {}) }; for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === "object" && !Array.isArray(v) ? deepMerge(o[k], v) : v; return o; }
function randId(n = 20) { const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"; const a = crypto.getRandomValues(new Uint8Array(n)); return [...a].map(x => c[x % c.length]).join(""); }
function makeKey() { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const a = crypto.getRandomValues(new Uint8Array(6)); const s = [...a].map(x => c[x % c.length]).join(""); return s.slice(0, 3) + "-" + s.slice(3); }

async function demoBackend() {
  // Demo: everything lives in this browser (localStorage); other tabs of this browser stay in sync. ?as=NAME simulates another device.
  const P = "mcast-judging-demo:";
  let uid = params.get("as"); if (!uid) { try { uid = sessionStorage.getItem(P + "uid") || ("dev-" + randId(6)); sessionStorage.setItem(P + "uid", uid); } catch (e) { uid = "dev-" + randId(6); } }
  const read = k => { try { return JSON.parse(localStorage.getItem(P + k) || "null"); } catch (e) { return null; } };
  const write = (k, v) => { localStorage.setItem(P + k, JSON.stringify(v)); bus.postMessage(k); fire(k); };
  const subs = new Map(), bus = new BroadcastChannel("mcast-judging-demo");
  const fire = k => (subs.get(k) || []).forEach(f => f());
  bus.onmessage = e => fire(e.data);
  const on = (k, f) => { subs.set(k, [...(subs.get(k) || []), f]); f(); };
  const isOwner = e => { const ev = read("ev:" + e); return ev && (ev.owner === uid || (read("claims:" + e) || []).includes(uid)); };
  return {
    uid, demo: true,
    watchEvent: (e, cb) => on("ev:" + e, () => cb(read("ev:" + e))),
    watchJudges: (e, cb) => on("j:" + e, () => cb(read("j:" + e) || {})),
    async createEvent(data, key) { const id = randId(); localStorage.setItem(P + "key:" + id, JSON.stringify(key)); write("ev:" + id, data); return id; },
    async patchEvent(e, patch) { if (!isOwner(e)) throw new Error("permission-denied"); write("ev:" + e, { ...read("ev:" + e), ...patch }); },
    async patchJudge(e, j, data) {
      const all = read("j:" + e) || {}, cur = all[j] || {}, next = deepMerge(cur, data);
      const ok = isOwner(e) || (cur.uid === uid && next.uid === uid) || (!cur.uid && next.uid === uid);
      if (!ok) throw new Error("permission-denied");
      all[j] = next; write("j:" + e, all);
    },
    async claimOwner(e, key) { if (read("key:" + e) !== key) throw new Error("permission-denied"); write("claims:" + e, [...(read("claims:" + e) || []), uid]); },
    async isClaimedOwner(e) { return (read("claims:" + e) || []).includes(uid); },
    async readKey(e) { return isOwner(e) ? read("key:" + e) : null; },
  };
}

async function firebaseBackend() {
  const [{ initializeApp }, A, F] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js")]);
  const app = initializeApp(FIREBASE_CONFIG), auth = A.getAuth(app), db = F.getFirestore(app);
  // ?fresh = act as a brand-new device (used for testing); otherwise the device keeps its identity across visits.
  await A.setPersistence(auth, params.has("fresh") ? A.inMemoryPersistence : A.browserLocalPersistence).catch(() => {});
  const user = await new Promise((res, rej) => { const off = A.onAuthStateChanged(auth, u => { if (u) { off(); res(u); } }); A.signInAnonymously(auth).catch(rej); });
  const uid = user.uid, evRef = e => F.doc(db, "events", e);
  return {
    uid, demo: false,
    watchEvent: (e, cb, onErr) => F.onSnapshot(evRef(e), s => cb(s.exists() ? s.data() : null), onErr),
    watchJudges: (e, cb, onErr) => F.onSnapshot(F.collection(db, "events", e, "judges"), qs => { const m = {}; qs.forEach(d => m[d.id] = d.data()); cb(m); }, onErr),
    async createEvent(data, key) {
      const ref = F.doc(F.collection(db, "events")), b = F.writeBatch(db);
      b.set(ref, data); b.set(F.doc(db, "events", ref.id, "private", "admin"), { key }); await b.commit(); return ref.id;
    },
    patchEvent: (e, patch) => F.updateDoc(evRef(e), patch),
    patchJudge: (e, j, data) => F.setDoc(F.doc(db, "events", e, "judges", String(j)), data, { merge: true }),
    claimOwner: (e, key) => F.setDoc(F.doc(db, "events", e, "ownerClaims", uid), { key }),
    async isClaimedOwner(e) { try { return (await F.getDoc(F.doc(db, "events", e, "ownerClaims", uid))).exists(); } catch (x) { return false; } },
    async readKey(e) { try { const s = await F.getDoc(F.doc(db, "events", e, "private", "admin")); return s.exists() ? s.data().key : null; } catch (x) { return null; } },
  };
}

/* ============ rendering ============ */
const app = document.getElementById("app");

function draw() {

  app.innerHTML = view();

function qrSvg(text) { if (typeof qrcode !== "function") return ""; try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: "QR code" }); } catch (e) { return ""; } }

function view() {
  if (S.error) return `<div class="banner err">${esc(S.error)}</div>`;
  if (!S.eventId) return viewStart();
  if (S.ev === undefined) return `<p class="muted">Connecting to the judging event…</p>`;
  if (S.ev === null) return `<div class="banner err">This judging event doesn't exist (or the link is incomplete). Ask the organiser for the link again.</div>${viewStart()}`;
  if (S.audience) return `<div class="panel">${viewFinal()}</div>`;
  const mine = myTab(), showFinal = S.owner || !!S.ev.final;
  if (S.tab === "final" && !showFinal) S.tab = "master";
  const tabs = `<div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${S.tab === "master"}" data-tab="master">Master${S.owner ? ' <span class="you">you</span>' : ""}</button>
    ${Array.from({ length: N() }, (_, i) => { const n = scored(i), T = teams().length; return `<button class="tab" role="tab" aria-selected="${S.tab === i}" data-tab="${i}">${esc(jname(i))}<span class="pill ${T && n === T ? "full" : ""}">${n}/${T}</span>${mine === i ? '<span class="you">you</span>' : ""}</button>`; }).join("")}
    ${showFinal ? `<button class="tab" role="tab" aria-selected="${S.tab === "final"}" data-tab="final">🏆 Final results${S.ev.final ? "" : ' <span class="pill">preview</span>'}</button>` : ""}</div>`;
  const demo = S.be.demo ? `<div class="banner warn noprint"><b>Demo mode:</b> data is kept in this browser only. ${FIREBASE_CONFIG ? "" : "Live sharing between devices switches on once the Firebase config is added."}</div>` : "";
  return demo + tabs + `<div class="panel">${S.tab === "master" ? viewMaster() : S.tab === "final" ? viewFinal() : viewJudge(S.tab)}</div>`;
}

}

      <div class="row">${myTab() !== null ? `<button class="btn" data-tab="${myTab()}">Go to my tab</button>` : Array.from({ length: N() }, (_, i) => !jdoc(i).uid ? `<button class="btn sm" data-tab="${i}">${esc(jname(i))}</button>` : "").join("")}</div>

function viewResults() {
  const { list, rows } = ranked();
  const who = (L, max) => !L ? `<div class="who">—</div>` : `<div class="who">${L.teams.map(tlabel).join("<br>")}</div><span class="sc">${fmt(L.best)} / ${max} average${L.how ? " · " + L.how : ""}</span>`;
  const done = Array.from({ length: N() }, (_, i) => scored(i)).filter(n => n === teams().length && n > 0).length;
  return `<h2>Results ${teams().length ? `<span class="tag ${done === N() ? "ok" : "mut"}">${done} of ${N()} judges finished</span>` : ""}</h2>
  <div class="leaders">
    <div><strong>Best Research Impact</strong>Highest average on criteria 1 + 2${who(decide(list, [IMP, TOTAL, C2]), 10)}</div>
    <div><strong>Most Valorisation Potential</strong>Highest average on criterion 3${who(decide(list, [C3, TOTAL, C2]), 5)}</div>
    <div class="pc"><strong>People's Choice</strong>Audience vote<div class="who">Not scored by judges</div></div></div>
  <h2>Ranking</h2>
  <div class="tw"><table><tr><th class="n">Rank</th><th>Team</th>${Array.from({ length: N() }, (_, i) => `<th class="n">${esc(jname(i))}</th>`).join("")}<th class="n">Avg 1</th><th class="n">Avg 2</th><th class="n">Avg 3</th><th class="n">Avg 4</th><th class="n">Impact /10</th><th class="n">Average /20</th><th class="n">Combined /${N() * 20}</th></tr>
  ${rows.map(t => { const notes = t.by.filter(b => b.note); return `<tr class="${t.rank === 1 ? "top1" : ""}"><td class="n">${t.rank ? `<span class="rank">${t.rank}</span>` : "–"}</td>
    <td><b>${tlabel(t)}</b>${t.tied ? '<span class="tag">tied – panel decides</span>' : ""}${t.split ? '<span class="tag info">split on criterion 2</span>' : ""}${t.n === N() ? '<span class="tag ok">all judges</span>' : `<span class="tag">${t.n} of ${N()} judges</span>`}
    ${notes.length ? `<details><summary>Judges' notes (${notes.length})</summary><ul class="notes">${notes.map(b => `<li><b>${esc(b.judge)}:</b> ${esc(b.note)}</li>`).join("")}</ul></details>` : ""}</td>
    ${t.by.map(b => `<td class="n">${full(b.m) ? sum(b.m) : b.m.some(Boolean) ? '<span class="muted">part</span>' : '<span class="muted">—</span>'}</td>`).join("")}
    ${t.c.map(v => `<td class="n">${v == null ? "–" : fmt(v)}</td>`).join("")}<td class="n">${t.impact == null ? "–" : fmt(t.impact)}</td><td class="n big">${t.total == null ? "–" : fmt(t.total)}</td><td class="n">${t.combined ?? "–"}</td></tr>`; }).join("") || `<tr><td colspan="9" class="muted">Add teams to start.</td></tr>`}
  </table></div>
  <div class="how"><b>How it's calculated.</b> A judge counts for a team once all four criteria are marked. The <b>average total /20</b> sets the ranking. <b>Best Research Impact</b> = highest average of criteria 1 + 2; <b>Most Valorisation Potential</b> = highest average of criterion 3.
    <b>Tie-break:</b> award score (or total) → higher average total → higher average on criterion 2 (Clarity of Impact Pathway) → panel decides. People's Choice is an audience vote.</div>
  <div class="row noprint" style="margin-top:14px"><button class="btn" data-act="csv">Download results (CSV)</button><button class="btn alt" data-act="print">Print</button></div>`;
}

function viewJudge(i) {
  if (i >= N()) { S.tab = "master"; return viewMaster(); }
  const d = jdoc(i), mine = myTab(), edit = canEdit(i), T = teams();
  const head = `<div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:6px 0">${esc(jname(i))}</h2>
    <span>${S.owner && !(d.uid === S.be.uid) ? '<span class="tag info">organiser can edit</span>' : ""}${d.uid === S.be.uid ? '<span class="tag ok">your tab</span>' : d.uid ? '<span class="tag mut">joined on another device</span>' : '<span class="tag mut">not joined yet</span>'} <span class="tag mut">${scored(i)}/${T.length} scored</span></span></div>`;
  if (!d.uid && !S.owner && mine === null) {
    return head + `<div class="card tint claim"><h3>Is this you?</h3><p class="muted" style="margin:0 0 10px">Confirm your name to start marking. This tab will then be saved to this device, so other judges can't change it.</p>
      <div class="row"><input type="text" data-fk="cname-${i}" id="cname" value="${esc(S.ev.judgeNames?.[i] || "")}" placeholder="Your name" style="max-width:280px"><button class="btn" data-act="claim" data-v="${i}">Start marking</button></div></div>`;
  }
  if (!canSee(i)) return head + `<div class="banner info">${mine !== null ? `You're marking as <b>${esc(jname(mine))}</b>. <button class="btn sm" data-tab="${mine}">Go to my tab</button>` : "This tab belongs to another judge."} Each judge's marks are private to them and the organiser.</div>`;
  if (!T.length) return head + `<div class="banner info">The organiser hasn't added the teams yet. They'll appear here automatically.</div>`;
  const guide = `<details ${edit ? "open" : ""} class="noprint"><summary style="font-size:14px">How to score</summary><div class="guide">${SCALE.map((s, k) => `<div><b>${k + 1}</b><strong>${s[0]}</strong><br>${s[1]}</div>`).join("")}</div>
    <p class="muted" style="margin:4px 0 0">Each criterion is weighted equally at 25%. Tap a score again to clear it. Marks save automatically.</p></details>`;
  const cards = T.map(t => {
    const m = marks(i, t.id), done = full(m), note = d.notes?.[t.id] || "";
    return `<section class="team ${done ? "done" : ""}"><div class="thead"><b>${tlabel(t)}</b>${done ? '<span class="tag ok">complete</span>' : `<span class="tag">${m.filter(Boolean).length} of 4 scored</span>`}</div>
      ${CRIT.map((c, k) => `<div class="crit"><div><div class="t"><i>${k + 1}</i>${esc(c[0])} <span class="muted">· 25%</span></div><div class="q">${esc(c[1])}</div></div>
        <div class="seg" role="group" aria-label="${esc(c[0])}">${[1, 2, 3, 4, 5].map(v => `<button class="sc" aria-pressed="${m[k] === v}" ${edit ? "" : "disabled"} data-act="mark" data-j="${i}" data-t="${t.id}" data-c="${k}" data-v="${v}">${v}</button>`).join("")}</div></div>`).join("")}
      <div class="notesbox">${edit ? `<textarea data-fk="note-${i}-${t.id}" data-note="${i}|${t.id}" placeholder="Notes: strengths, concerns, questions…">${esc(note)}</textarea>` : `<div class="ro">${note ? esc(note) : '<span class="muted">No notes.</span>'}</div>`}</div>
      <div class="tfoot"><strong>Scores</strong><div class="row" style="gap:16px"><div class="pv"><small>Research Impact (1 + 2)</small><b>${m[0] && m[1] ? m[0] + m[1] : "–"} / 10</b></div><div class="pv"><small>Total</small><b>${m.some(Boolean) ? sum(m) : "–"} / 20</b></div></div></div></section>`;
  }).join("");
  const sumtbl = `<h2>${esc(jname(i))}: summary</h2><div class="tw"><table><tr><th>Team</th><th class="n">1</th><th class="n">2</th><th class="n">3</th><th class="n">4</th><th class="n">Impact /10</th><th class="n">Total /20</th></tr>
    ${T.map(t => { const m = marks(i, t.id); return `<tr><td>${tlabel(t)}</td>${m.map(v => `<td class="n">${v || "–"}</td>`).join("")}<td class="n">${m[0] && m[1] ? m[0] + m[1] : "–"}</td><td class="n big">${full(m) ? sum(m) : m.some(Boolean) ? '<span class="muted">part</span>' : "–"}</td></tr>`; }).join("")}</table></div>`;
  return head + (edit && !S.owner ? `<div class="banner ok">This is your tab. Marks save as you tap, and the organiser sees them straight away.</div>` : "") + guide + cards + sumtbl;
}


/* ============ final results ============ */
function fset() {
  if (!S.fset) { const f = S.ev?.final; S.fset = f ? { places: f.places, scores: f.showScores, pc: f.pcId || "" } : { places: 3, scores: true, pc: "" }; }
  return S.fset;
}
function buildFinal() {
  const o = fset(), { list, rows } = ranked(), lab = t => (t.no ? "#" + t.no + " " : "") + (t.name || "Untitled team");
  const scoredRows = rows.filter(t => t.rank), cut = o.places === "all" ? Infinity : o.places;
  const top = scoredRows.filter(t => t.rank <= cut).map(t => ({ rank: t.rank, no: t.no || "", name: t.name || "Untitled team", total: t.total == null ? null : Math.round(t.total * 100) / 100, tied: !!t.tied }));
  const aw = L => L ? { teams: L.teams.map(lab), best: Math.round(L.best * 100) / 100, how: L.how || "" } : null;
  const pcT = teams().find(t => t.id === o.pc);
  return { places: o.places, showScores: !!o.scores, pcId: o.pc || "", pc: pcT ? lab(pcT) : "", rows: top, totalTeams: scoredRows.length,
    awards: { impact: aw(decide(list, [IMP, TOTAL, C2])), valor: aw(decide(list, [C3, TOTAL, C2])) }, publishedAt: new Date().toISOString() };
}
function viewFinalControls() {

    <label class="switch"><input type="checkbox" data-act="fall" ${o.places === "all" ? "checked" : ""}> Show every team</label>

    <div class="row" style="justify-content:flex-end">${f ? `<span class="tag ok">Published ${esc(new Date(f.publishedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))}</span><button class="btn cy" data-act="pub">Update</button><button class="btn ghost" data-act="unpub">Unpublish</button>` : `<button class="btn cy" data-act="pub">Publish final results</button>`}</div>
  </div>
  <p class="muted" style="margin:12px 0 0">Publishing freezes the results as they are now and shows a <b>Final results</b> tab to everyone, judges included. Teams tied on the last place shown are all included. Later changes to marks only appear when you tap <b>Update</b>. Check the 🏆 tab preview first.</p>
  ${f ? `<div class="row" style="margin-top:12px;gap:16px;align-items:center"><div class="qr" style="width:120px;height:120px" data-qr="${esc(resultsLink())}"></div><div style="flex:1 1 300px"><b>Results link for the audience</b> <span class="muted">(shows only the final results)</span><div class="link" style="margin:6px 0">${esc(resultsLink())}</div><button class="btn sm" data-act="copy" data-v="${esc(resultsLink())}">Copy results link</button></div></div>` : ""}
  </div>`;
}
function viewFinal() {
  const pub = S.ev.final, f = pub || (S.owner ? buildFinal() : null);
  const head = `<div class="fh"><div class="k">MCAST R&amp;I Expo 2026 · Innovation &amp; Valorisation Pitch Session</div><h2>Final results</h2>`;
  if (!f) return `<div class="final">${head}</div><div class="banner info" style="display:inline-block;margin-top:14px">The results will appear here as soon as the organiser announces them.</div></div>`;
  const sc = t => f.showScores && t.total != null ? `<div class="ts">${fmt(t.total)} / 20 average</div>` : "";
  const podium = f.rows.filter(t => t.rank <= 3), rest = f.rows.filter(t => t.rank > 3);
  const ordered = podium.length === 3 && new Set(podium.map(t => t.rank)).size === 3 ? [podium[1], podium[0], podium[2]] : podium;
  const ord = n => ["", "1st", "2nd", "3rd"][n] || n + "th";
  const awardTxt = a => !a ? "—" : a.teams.map(esc).join("<br>") + (a.teams.length > 1 ? "<small>Tied, decided by the panel</small>" : "");
  return `<div class="final">
    ${!pub ? `<div class="banner warn noprint" style="text-align:left"><b>Preview:</b> only you can see this. Publish it from the Master tab when you're ready.</div>` : ""}
    ${head}<div class="when">${f.places === "all" ? "All teams" : `Top ${f.places}`}${pub ? ` · announced ${esc(new Date(pub.publishedAt).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}` : ""}</div></div>
    ${f.rows.length ? `<div class="podium">${ordered.map(t => `<div class="place p${t.rank}"><span class="medal">${t.rank}</span><div class="tn">${esc(t.name)}</div><div class="tno">${t.no ? "Team " + esc(t.no) + " · " : ""}${ord(t.rank)} place</div>${sc(t)}${t.tied ? '<span class="tie">Tied</span>' : ""}</div>`).join("")}</div>
      ${rest.length ? `<div class="flist">${rest.map(t => `<div class="r"><b class="rk">${t.rank}</b><span><b>${esc(t.name)}</b>${t.no ? ` <span class="muted">Team ${esc(t.no)}</span>` : ""}${t.tied ? ' <span class="tag">tied</span>' : ""}</span>${f.showScores && t.total != null ? `<span class="sc2">${fmt(t.total)} / 20</span>` : ""}</div>`).join("")}</div>` : ""}`
      : `<div class="banner info" style="display:inline-block;margin-top:14px">No team has been fully scored yet.</div>`}
    <div class="awards3">
      <div><strong>Best Research Impact</strong><div class="w">${awardTxt(f.awards.impact)}</div></div>
      <div><strong>Most Valorisation Potential</strong><div class="w">${awardTxt(f.awards.valor)}</div></div>
      <div class="pc"><strong>People's Choice</strong><div class="w">${f.pc ? esc(f.pc) : "To be announced"}</div></div>
    </div>
    <div class="row noprint" style="justify-content:center;margin-top:22px"><button class="btn" data-act="present">⛶ Present full screen</button>${S.owner ? `<button class="btn alt" data-act="print">Print</button>` : ""}</div>
  </div>`;
}

/* ============ actions ============ */
const E = () => S.eventId;
// Apply organiser edits locally first, so quick successive edits never build on a stale copy.
function patchEv(patch) { S.ev = { ...S.ev, ...patch }; render(); return save(S.be.patchEvent(E(), patch)); }
app.addEventListener("click", async e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { S.tab = tb.dataset.tab === "master" || tb.dataset.tab === "final" ? tb.dataset.tab : +tb.dataset.tab; render(); scrollTo({ top: app.offsetTop - 8, behavior: "smooth" }); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.type === "checkbox") return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === "create") {
    const n = Math.min(MAXJ, Math.max(1, parseInt(document.getElementById("startN").value, 10) || 4)), key = makeKey();
    b.disabled = true;
    try {
      const id = await S.be.createEvent({ owner: S.be.uid, title: "Innovation & Valorisation Pitch Session", numJudges: n, judgeNames: [], teams: [], showToJudges: false, createdAt: new Date().toISOString() }, key);
      try { localStorage.setItem("mcast-judging-key:" + id, key); } catch (x) {}
      const u = new URL(location.href); u.searchParams.set("e", id); history.replaceState(null, "", u); S.eventId = id; S.key = key; start();
    } catch (x) { console.error(x); b.disabled = false; alert("Couldn't create the event. Check the connection and try again."); }
  }
  if (act === "copy") copyText(v, b);
  if (act === "qrpng") saveQr();
  if (act === "addteam") { const ts = [...teams(), { id: randId(8), no: String(teams().length + 1), name: "" }]; patchEv({ teams: ts }); }
  if (act === "rmteam") { const t = teams().find(x => x.id === v); if (confirm(`Remove ${t.name || "team " + t.no}? Its marks will no longer count.`)) patchEv({ teams: teams().filter(x => x.id !== v) }); }
  if (act === "nj") { const n = Math.min(MAXJ, Math.max(1, N() + +v)); if (n < N() && Object.keys(jdoc(n).marks || {}).length && !confirm(`${jname(n)} has marks. Hide their tab? (The marks are kept and come back if you add the judge again.)`)) return; patchEv({ numJudges: n }); }
  if (act === "unlock") { if (confirm(`Unlock ${jname(+v)}'s tab so they can open it on another device? Their marks stay.`)) save(S.be.patchJudge(E(), v, { uid: null })); }
  if (act === "claim") {
    const name = (document.getElementById("cname").value || "").trim(); if (!name) { document.getElementById("cname").focus(); return; }
    await save(S.be.patchJudge(E(), v, { uid: S.be.uid, name, joinedAt: new Date().toISOString() }));
  }
  if (act === "mark") {
    const j = +b.dataset.j, tid = b.dataset.t, c = +b.dataset.c, val = +v; if (!canEdit(j)) return;
    const m = [...marks(j, tid)]; m[c] = m[c] === val ? 0 : val;
    S.judges[String(j)] = deepMerge(jdoc(j), { marks: { [tid]: m } }); render();
    save(S.be.patchJudge(E(), j, { marks: { [tid]: m }, updatedAt: new Date().toISOString() }));
  }
  if (act === "ownerkey") {
    const key = (document.getElementById("okey").value || "").trim().toUpperCase().replace(/\s+/g, ""); if (!key) return;
    try { await S.be.claimOwner(E(), key.includes("-") ? key : key.slice(0, 3) + "-" + key.slice(3)); S.owner = true; S.key = await S.be.readKey(E()); render(); }
    catch (x) { alert("That organiser key doesn't match this event."); }
  }
  if (act === "fp") { const o = fset(); if (o.places !== "all") o.places = Math.max(1, Math.min(Math.max(teams().length, 1), o.places + +v)); render(); }
  if (act === "pub") { const f = buildFinal(); if (!f.rows.length && !confirm("No team is fully scored yet. Publish anyway?")) return; patchEv({ final: f }); }
  if (act === "unpub") { if (confirm("Hide the final results from everyone?")) patchEv({ final: null }); }
  if (act === "present") { document.body.classList.add("present"); if (S.tab !== "final") { S.tab = "final"; render(); } document.documentElement.requestFullscreen?.().catch(() => {}); scrollTo(0, 0); }
  if (act === "csv") downloadCsv();
  if (act === "print") print();
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "vis") return patchEv({ showToJudges: t.checked });
  if (t.dataset.act === "fall") { fset().places = t.checked ? "all" : 3; return render(); }
  if (t.dataset.act === "fscores") { fset().scores = t.checked; return render(); }
  if (t.dataset.act === "fpc") { fset().pc = t.value; return render(); }
  if (t.dataset.team) { const ts = teams().map(x => x.id === t.dataset.team ? { ...x, [t.dataset.f]: t.value.trim() } : x); patchEv({ teams: ts }); }
  if (t.dataset.jname !== undefined) { const names = Array.from({ length: Math.max(N(), (S.ev.judgeNames || []).length) }, (_, i) => S.ev.judgeNames?.[i] || ""); names[+t.dataset.jname] = t.value.trim(); patchEv({ judgeNames: names }); }
});
const noteTimers = {};
app.addEventListener("input", e => {
  const t = e.target; if (!t.dataset.note) return;
  const [j, tid] = t.dataset.note.split("|"); clearTimeout(noteTimers[t.dataset.note]);
  noteTimers[t.dataset.note] = setTimeout(() => { S.judges[j] = deepMerge(jdoc(j), { notes: { [tid]: t.value } }); save(S.be.patchJudge(E(), j, { notes: { [tid]: t.value }, updatedAt: new Date().toISOString() })); }, 600);
});
app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "cname") app.querySelector('[data-act="claim"]')?.click(); if (e.key === "Enter" && e.target.id === "okey") app.querySelector('[data-act="ownerkey"]')?.click(); if (e.key === "Enter" && e.target.matches("input[data-team], input[data-jname]")) e.target.blur(); });

document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("present"); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("present")) document.body.classList.remove("present"); });
function copyText(url, btn) {
  const done = ok => { const t = btn.textContent; btn.textContent = ok ? "Copied ✓" : "Copy failed"; setTimeout(() => btn.textContent = t, 1600); };
  const fb = () => { const ta = document.createElement("textarea"); ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (x) {} ta.remove(); done(ok); };
  if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(url).then(() => done(true), fb); else fb();
}
function saveQr() {
  const svg = app.querySelector("[data-qr] svg"); if (!svg) return;
  const img = new Image(), c = document.createElement("canvas"); c.width = c.height = 1000;
  img.onload = () => { const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 1000, 1000); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, 1000, 1000); const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "judging-link-qr.png"; a.click(); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
}
function downloadCsv() {
  const { rows } = ranked(), q = v => `"${String(v ?? "").replace(/"/g, '""')}"`, jn = Array.from({ length: N() }, (_, i) => jname(i));
  const head = ["Rank", "Team no.", "Team / idea name", ...jn.flatMap(j => [`${j} 1`, `${j} 2`, `${j} 3`, `${j} 4`, `${j} total`, `${j} notes`]), ...CRIT.map((c, k) => `Avg ${k + 1}. ${c[0]}`), "Avg Research Impact /10", "Average total /20", `Combined /${N() * 20}`, "Judges counted", "Tied (panel decides)"];
  const lines = [head.map(q).join(",")].concat(rows.map(t => [t.rank ?? "", t.no, t.name, ...t.by.flatMap(b => [...b.m.map(v => v || ""), full(b.m) ? sum(b.m) : "", b.note]), ...t.c.map(v => v == null ? "" : fmt(v)), t.impact == null ? "" : fmt(t.impact), t.total == null ? "" : fmt(t.total), t.combined ?? "", t.n, t.tied ? "yes" : ""].map(q).join(",")));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" })); a.download = "pitch-session-results.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============ start ============ */
let unsub = [];
async function start() {
  unsub.forEach(f => typeof f === "function" && f()); unsub = [];
  if (!S.eventId) return render();
  const onErr = x => { console.error(x); S.error = /permission/i.test(x.code || x.message) ? "This browser isn't allowed to open the judging event. Check the link with the organiser." : "Lost connection to the judging event. Check the internet connection and reload."; render(); };
  let first = true;
  unsub.push(S.be.watchEvent(S.eventId, async ev => {
    S.ev = ev;
    if (ev && first) { first = false;
      S.owner = ev.owner === S.be.uid || await S.be.isClaimedOwner(S.eventId);
      if (S.owner) { try { S.key = localStorage.getItem("mcast-judging-key:" + S.eventId); } catch (x) {} if (!S.key) S.key = await S.be.readKey(S.eventId); }
      const m = myTab(); if (!S.owner && m !== null) S.tab = m;
    }
    render();
  }, onErr));
  unsub.push(S.be.watchJudges(S.eventId, js => { S.judges = js; if (S.tab === "master" && !S.owner && myTab() !== null && !S.jumped) { S.jumped = true; S.tab = myTab(); } render(); }, onErr));
}
(async () => {
  try { S.be = DEMO ? await demoBackend() : await firebaseBackend(); }
  catch (x) { console.error(x); S.error = "Couldn't connect to the judging service. Check the internet connection and reload. If it keeps happening, the paper scorecard and offline tools are linked at the bottom."; return render(); }
  start();
})();
</script>
</body></html>
